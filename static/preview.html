<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Widget Preview</title>
<style>body{margin:0;background:#f0f2f5;min-height:400px;}</style>
</head>
<body>
<script>
  const key = new URLSearchParams(window.location.search).get('key');
  if (key) {
    const s = document.createElement('script');
    s.src = window.location.origin + '/widget.js';
    s.setAttribute('data-api-key', key);
    document.body.appendChild(s);
  }
</script>
</body>
</html>
